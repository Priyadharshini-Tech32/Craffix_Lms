<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craffix LMS</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <!-- jsPDF for Certificate export and printing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <!-- AUTHENTICATION VIEW (LOGIN & SIGN UP) -->
  <div id="auth-view" class="auth" style="display: none;">
    <div class="card auth-card">
      <div class="logo-plate">
        <img src="logo.png" alt="Craffix LMS">
      </div>
      <h1 id="auth-title">Login</h1>

      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        <!-- Extra name field for student account registration -->
        <div id="register-fields" style="display: none; flex-direction: column; gap: 16px; margin-bottom: 16px;">
          <label>
            Full Name
            <input type="text" id="auth-name" placeholder="John Doe">
          </label>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <label>
            Email Address
            <input type="email" id="auth-email" placeholder="you@domain.com" required>
          </label>
          <label>
            Password
            <input type="password" id="auth-password" placeholder="••••••••" required>
          </label>
        </div>

        <div id="auth-err" class="err" style="display: none; margin-top: 14px;"></div>

        <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%;">
          <button type="submit" id="auth-submit-btn" class="btn btn-full">Login</button>
          <button type="button" id="auth-toggle-mode-btn" class="link" onclick="toggleAuthMode()">
            New student? Create account free
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MAIN LMS APPLICATION VIEW -->
  <div id="app-view" class="shell" style="display: none;">
    <!-- SIDEBAR -->
    <aside class="side">
      <div class="logo-plate">
        <img src="logo.png" alt="Craffix LMS">
      </div>

      <div id="nav-items" class="nav-items">
        <!-- Injected dynamically based on user role -->
      </div>

      <div class="sidebar-bottom">
        <button id="nav-Notification" class="nav" onclick="handleNavClick('Notification')">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </span>
          <span class="nav-label">Notification</span>
        </button>
        <button id="nav-Setting" class="nav" onclick="handleNavClick('Setting')">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </span>
          <span class="nav-label">Setting</span>
        </button>

      </div>
    </aside>

    <!-- MAIN DASHBOARD CONTENT -->
    <div class="main">
      <header>
        <div>
          <h1 id="header-title">Dashboard</h1>
          <small id="header-user">Welcome back</small>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div id="header-actions"></div>
          <button class="btn btn-secondary btn-sm" onclick="handleLogout()">Sign Out</button>
        </div>
      </header>

      <!-- Alert Banner -->
      <div id="app-alert" style="display: none; margin: 16px 32px 0; padding: 12px 18px; border-radius: 8px; font-size: 13px; font-weight: 500;"></div>

      <!-- Main Dynamic Content Container -->
      <main id="content-view">
        <!-- Rendered by app.js -->
      </main>

      <!-- Footer with company all rights reserved for all users -->
      <footer class="footer">
        <div class="copyright">© 2026 <a href="https://craffix.com" target="_blank" rel="noopener noreferrer">Craffix Web Technologies</a>. All rights reserved.</div>
      </footer>
    </div>
  </div>

  <!-- UNIVERSAL MODAL CONTAINER -->
  <div id="modal-container" class="modal-overlay" style="display: none;" onclick="closeModal(event)">
    <div class="modal-card" id="modal-card" onclick="event.stopPropagation()">
      <div class="card-header" style="margin-bottom: 14px;">
        <h3 id="modal-title" style="margin: 0; font-size: 16px; font-weight: 700;">Modal</h3>
        <button class="btn btn-secondary btn-sm" onclick="closeModal()" style="border: none; padding: 4px 8px; font-size: 16px; line-height: 1;">&times;</button>
      </div>
      <div id="modal-body" class="table-container" style="border: none;"></div>
      <div id="modal-footer" style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
